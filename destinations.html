<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse all ten destinations in Lanka Explorer and filter them by category, name or entry fee.">
  <title>Lanka Explorer | Destinations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

</head>
<body>

  <header>
    <a href="index.html" class="logo">Lanka Explorer</a>
    <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">&#9776;</button>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html" class="active">Destinations</a></li>
        <li><a href="trip.html">My Trip</a></li>
        <li><a href="about.html">About</a></li>
        <li><button class="theme-toggle" type="button">Dark mode</button></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="page-title">
      <h1>All Destinations</h1>
      <p>Find your next adventure across Sri Lanka.</p>
    </section>

    <section id="controls">
      <h2>Find a Destination</h2>

      <label for="search">Search</label>
      <input type="search" id="search" placeholder="e.g. Ella">

      <label for="category">Category</label>
      <select id="category">
        <option value="all">All</option>
        <option value="Heritage">Heritage</option>
        <option value="Beach">Beach</option>
        <option value="Nature">Nature</option>
        <option value="Wildlife">Wildlife</option>
      </select>

      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="name">Name (A&ndash;Z)</option>
        <option value="fee-low">Entry fee (low to high)</option>
        <option value="fee-high">Entry fee (high to low)</option>
      </select>

      <button id="clear-filters" type="button">Clear filters</button>
    </section>

    <!-- Cards will be generated by JavaScript in Week 03.
         For now, six sample cards are hard-coded so they can be styled in Week 02. -->
    <p id="result-count" aria-live="polite"></p>

    <section id="destination-list">
      <h2 class="visually-hidden">Destinations</h2>
      <!-- Cards are generated by JavaScript from data/destinations.json -->
    </section>

    <section id="map-section">
      <h2>Explore on the Map</h2>
      <div id="all-map"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Lanka Explorer &ndash; W.T.D. Rajarathna. All rights reserved.</p>
    <p>Contact: <a href="mailto:hello@lankaexplorer.lk">hello@lankaexplorer.lk</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
